apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation-service
  namespace: kinara-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documentation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: documentation-service
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
      - name: documentation-service
        image: registry.digitalocean.com/kinara/documentation-service:latest
        ports:
        - containerPort: 8106
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: documentation-service-secrets
              key: database-url
        - name: JWT_PUBLIC_KEY_PATH
          value: /etc/jwt/public.pem
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: redis-url
        - name: AES_KEY
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: aes-key
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /health
            port: 8106
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8106
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: documentation-service
  namespace: kinara-os
spec:
  selector:
    app: documentation-service
  ports:
  - port: 8106
    targetPort: 8106
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: documentation-service-hpa
  namespace: kinara-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: documentation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: documentation-service-pdb
  namespace: kinara-os
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: documentation-service
