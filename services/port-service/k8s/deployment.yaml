apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-service
  namespace: kinara
  labels:
    app: port-service
    pillar: maritime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: port-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: port-service
        pillar: maritime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: port-service
        image: registry.digitalocean.com/kinara/port-service:latest
        ports:
        - containerPort: 8098
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: port-service-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: port-service-secrets
              key: redis-url
        - name: JWT_PUBLIC_KEY_PATH
          value: /etc/kinara/jwt/public.pem
        - name: TLS_CERT_FILE
          value: /etc/kinara/tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/kinara/tls/tls.key
        - name: TLS_CA_FILE
          value: /etc/kinara/tls/ca.crt
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8098
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8098
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: port-service-hpa
  namespace: kinara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: port-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: port-service-pdb
  namespace: kinara
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: port-service
