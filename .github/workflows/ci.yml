name: Kinara OS CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/kinara-registry
  GO_VERSION: "1.25"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - appointment-service
          - audit-service
          - cargo-maritime-service
          - cargo-service
          - clinical-service
          - compliance-service
          - cooperative-service
          - crew-service
          - customs-service
          - dock-service
          - documentation-service
          - driver-service
          - farmer-finance-service
          - farmer-service
          - fleet-service
          - governance-service
          - health-analytics-service
          - health-compliance-service
          - immunization-service
          - input-service
          - irrigation-service
          - lab-service
          - last-mile-service
          - livestock-service
          - logistics-analytics-service
          - market-service
          - notification-service
          - outbreak-service
          - patient-service
          - payment-service
          - pharmacy-service
          - port-service
          - referral-service
          - route-service
          - shipment-service
          - shipping-service
          - sms-gateway
          - supply-chain-service
          - telemedicine-service
          - trade-finance-service
          - transport-service
          - vessel-service
          - voyage-service
          - wallet-service
          - warehouse-service
          - weather-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test ${{ matrix.service }}
        env:
          GOWORK: "off"
          GONOSUMDB: "*"
          GOFLAGS: "-mod=mod"
        run: |
          cd services/${{ matrix.service }}
          go test ./... -v -timeout 60s -race
        continue-on-error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: kinara
          POSTGRES_DB: kinara
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Start services via Docker Compose
        run: |
          cp infrastructure/docker/.env.example infrastructure/docker/.env
          sed -i 's/change_me_in_production/testpass/g' infrastructure/docker/.env
          sed -i 's/change_me_32_byte_hex_key_here_00/abcdef1234567890abcdef1234567890/g' infrastructure/docker/.env
          docker compose -f infrastructure/docker/docker-compose.yml up -d \
            farmer-service market-service payment-service patient-service sms-gateway
        env:
          POSTGRES_PASSWORD: testpass
      - name: Wait for services
        run: |
          sleep 15
          curl -f http://localhost:8084/health || echo "farmer-service not ready"
          curl -f http://localhost:8086/health || echo "market-service not ready"
          curl -f http://localhost:8107/health || echo "payment-service not ready"
      - name: Run integration tests
        run: |
          cd tests/integration
          go test ./... -v -timeout 120s
        env:
          GOWORK: "off"
          KINARA_API_URL: http://localhost
          FARMER_URL: http://localhost:8084
          MARKET_URL: http://localhost:8086
          PAYMENT_URL: http://localhost:8107
          PATIENT_URL: http://localhost:8081

  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 21600
      - name: Build and push all service images
        run: |
          push_with_retry() {
            local image=$1
            for attempt in 1 2 3; do
              docker push "$image" && return 0
              echo "Push attempt $attempt failed for $image, retrying in 10s..."
              sleep 10
            done
            echo "All push attempts failed for $image"
            return 1
          }
          for svc in services/*/; do
            name=$(basename $svc)
            if [ -f "$svc/Dockerfile" ]; then
              echo "Building $name..."
              docker build -f $svc/Dockerfile -t $REGISTRY/$name:${{ github.sha }} -t $REGISTRY/$name:latest .
              push_with_retry $REGISTRY/$name:${{ github.sha }}
              push_with_retry $REGISTRY/$name:latest
            fi
          done
          echo "Building kinara-pgbouncer..."
          docker build -t $REGISTRY/kinara-pgbouncer:${{ github.sha }} -t $REGISTRY/kinara-pgbouncer:latest \
            infrastructure/pgbouncer
          push_with_retry $REGISTRY/kinara-pgbouncer:${{ github.sha }}
          push_with_retry $REGISTRY/kinara-pgbouncer:latest

  deploy-togo:
    name: Deploy to Togo Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: togo-prod
    steps:
      - uses: actions/checkout@v7
      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save kinara-togo-prod
      - name: Deploy via Helm
        run: |
          helm upgrade --install kinara-togo \
            infrastructure/helm/kinara-os \
            -f infrastructure/helm/kinara-os/values.yaml \
            -f infrastructure/helm/kinara-os/values-togo-prod.yaml \
            --namespace kinara-togo \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --timeout 10m \
            --wait
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/farmer-service -n kinara-togo --timeout=5m
          kubectl rollout status deployment/market-service -n kinara-togo --timeout=5m
          kubectl rollout status deployment/payment-service -n kinara-togo --timeout=5m
