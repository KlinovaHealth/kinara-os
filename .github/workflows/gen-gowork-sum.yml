name: Generate go.work.sum

on:
  workflow_dispatch:

jobs:
  sync:
    name: go mod tidy + go work sync and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Tidy pkg/auth (generates go.sum for prometheus dependency)
        run: |
          cd pkg/auth
          go mod tidy
          echo "pkg/auth/go.sum line count: $(wc -l < go.sum)"
          head -3 go.sum
      - name: Run go work sync
        run: go work sync
      - name: Confirm go.work.sum generated
        run: |
          if [ ! -f go.work.sum ]; then
            echo "ERROR: go.work.sum was not generated"
            exit 1
          fi
          echo "go.work.sum generated — line count: $(wc -l < go.work.sum)"
          head -5 go.work.sum
      - name: Commit and push sum files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/auth/go.sum go.work.sum
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$(cat <<'EOF'
fix: add go.sum files for workspace dependency resolution

Generates pkg/auth/go.sum (prometheus/client_golang added in f74bcb5
without checksums) and go.work.sum for the full workspace.

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
EOF
)"
          git push origin main
