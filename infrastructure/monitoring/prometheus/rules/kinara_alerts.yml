groups:
  - name: kinara_service_health
    rules:
      - alert: ServiceDown
        expr: up{job="kinara-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is DOWN"
          description: "{{ $labels.service }} has been unreachable for more than 1 minute. Immediate action required."

      - alert: HighErrorRate
        expr: |
          rate(traefik_service_requests_total{code=~"5.."}[5m]) /
          rate(traefik_service_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(traefik_service_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 2s)"

  - name: kinara_database
    rules:
      - alert: DatabaseHighLatency
        expr: pg_stat_activity_max_tx_duration > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database transaction latency > 500ms"

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connections at {{ $value | humanizePercentage }} capacity"

  - name: kinara_payment
    rules:
      - alert: PaymentFailureHigh
        expr: |
          rate(kinara_payment_failures_total[5m]) /
          rate(kinara_payment_attempts_total[5m]) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Payment failure rate above 1%"
          description: "Current failure rate: {{ $value | humanizePercentage }}"

      - alert: SettlementBacklog
        expr: kinara_settlement_pending_total > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Settlement backlog: {{ $value }} pending"

  - name: kinara_infrastructure
    rules:
      - alert: DiskUsageHigh
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage at {{ $value | humanizePercentage }}"

      - alert: MemoryUsageHigh
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage at {{ $value | humanizePercentage }}"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory at {{ $value | humanizePercentage }}"
