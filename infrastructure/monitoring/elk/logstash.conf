input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] {
    mutate {
      add_field => { "[@metadata][index]" => "kinara-%{[service]}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index]" => "kinara-unknown" }
    }
  }

  if [level] == "error" or [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }

  if [request_id] {
    mutate { add_field => { "trace_id" => "%{[request_id]}" } }
  }

  date {
    match => ["timestamp", "ISO8601", "UNIX"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
  if "error" in [tags] {
    stdout { codec => rubydebug }
  }
}
