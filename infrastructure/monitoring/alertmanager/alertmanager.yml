global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      continue: true
    - match:
        alertname: PaymentFailureHigh
      receiver: pagerduty-payment
    - match:
        alertname: ServiceDown
      receiver: pagerduty-oncall

receivers:
  - name: slack-default
    slack_configs:
      - channel: "#kinara-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: slack-critical
    slack_configs:
      - channel: "#kinara-critical"
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  - name: pagerduty-payment
    pagerduty_configs:
      - service_key: "${PAGERDUTY_PAYMENT_KEY}"
        description: 'Payment failure: {{ .GroupLabels.alertname }}'

  - name: pagerduty-oncall
    pagerduty_configs:
      - service_key: "${PAGERDUTY_ONCALL_KEY}"
        description: 'Service down: {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, service]
