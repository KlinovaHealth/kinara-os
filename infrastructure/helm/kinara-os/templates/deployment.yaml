{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}-service
    version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}-service
        version: {{ $.Chart.AppVersion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: {{ $name }}-service
          image: {{ $.Values.global.imageRegistry }}/{{ $name }}-service:{{ $.Chart.AppVersion }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-service-secrets
                  key: database-url
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ $.Values.global.jwtPublicKeyPath }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kinara-shared-secrets
                  key: redis-url
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: kinara-shared-secrets
                  key: aes-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt-keys
          secret:
            secretName: kinara-jwt-keys
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}-service
spec:
  selector:
    app: {{ $name }}-service
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service-hpa
  namespace: {{ $.Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $svc.replicas }}
  maxReplicas: {{ $svc.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-service-pdb
  namespace: {{ $.Values.global.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}-service
{{- end }}
