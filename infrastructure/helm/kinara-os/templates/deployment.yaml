{{- range $name, $svc := .Values.services }}
{{- $imageName := default (printf "%s-service" $name) $svc.image }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}-service
    version: {{ $.Chart.AppVersion }}
    pillar: kinara
spec:
  replicas: {{ $.Values.global.replicaOverride | default $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ $name }}-service
        version: {{ $.Chart.AppVersion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: "/metrics"
        {{- if $svc.metricsHttp }}
        prometheus.io/scheme: "http"
        {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: {{ $name }}-service
          image: {{ $.Values.global.imageRegistry }}/{{ $imageName }}:{{ $.Values.global.imageTag | default "latest" }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            # DB credentials from shared secret; DATABASE_URL assembled via K8s env var interpolation
            - name: _DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kinara-db-credentials
                  key: host
            - name: _DB_PORT
              valueFrom:
                secretKeyRef:
                  name: kinara-db-credentials
                  key: port
            - name: _DB_USER
              valueFrom:
                secretKeyRef:
                  name: kinara-db-credentials
                  key: user
            - name: _DB_PASS
              valueFrom:
                secretKeyRef:
                  name: kinara-db-credentials
                  key: pass
            - name: DATABASE_URL
              value: "postgresql://$(_DB_USER):$(_DB_PASS)@$(_DB_HOST):$(_DB_PORT)/{{ $svc.db }}?sslmode=require&pool_max_conns=2&pool_min_conns=0&pool_max_conn_idle_time=10s&pool_health_check_period=30s&default_query_exec_mode=simple_protocol"
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ $.Values.global.jwtPublicKeyPath }}
            - name: REDIS_URL
              value: "redis://kinara-redis:6379"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kinara-shared-secrets
                  key: encryption-key
            # TLS env vars — services use different naming conventions
            - name: TLS_CERT_PATH
              value: /etc/kinara/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/kinara/tls/tls.key
            - name: CA_CERT_PATH
              value: /etc/kinara/tls/ca.crt
            - name: TLS_CERT_FILE
              value: /etc/kinara/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/kinara/tls/tls.key
            - name: TLS_CA_FILE
              value: /etc/kinara/tls/ca.crt
            # JWT env var aliases — some services use JWT_PUBLIC_KEY, others JWT_PUBLIC_KEY_PATH
            - name: JWT_PUBLIC_KEY
              value: /etc/jwt/public.pem
            {{- if eq $name "auth" }}
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/jwt-private/private.pem
            {{- end }}
          resources:
            {{- if $.Values.defaultResources }}
            {{- toYaml $.Values.defaultResources | nindent 12 }}
            {{- else }}
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: jwt-public-key
              mountPath: /etc/jwt
              readOnly: true
            - name: tls-certs
              mountPath: /etc/kinara/tls
              readOnly: true
            {{- if eq $name "auth" }}
            - name: jwt-private-key
              mountPath: /etc/jwt-private
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt-public-key
          secret:
            secretName: kinara-jwt-public-key
        - name: tls-certs
          secret:
            secretName: kinara-tls-certs
        {{- if eq $name "auth" }}
        - name: jwt-private-key
          secret:
            secretName: kinara-jwt-private-key
        {{- end }}
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}-service
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}-service
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
{{- if $.Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service-hpa
  namespace: {{ $.Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $svc.replicas }}
  maxReplicas: {{ $svc.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}
{{- end }}
