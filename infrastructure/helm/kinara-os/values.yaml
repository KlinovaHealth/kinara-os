dashboards:
  admin-backend:        { port: 8117, replicas: 2 }
  government-backend:   { port: 8116, replicas: 2 }

monitoring:
  prometheus:
    enabled: true
    storageSize: 50Gi
    retention: 30d
  grafana:
    enabled: true
    adminPassword: kinara2026
  alertmanager:
    enabled: true
  elk:
    enabled: true
    elasticsearchMemory: 2Gi
