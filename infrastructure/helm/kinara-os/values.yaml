global:
  imageRegistry: ghcr.io/klinovahealth
  imageTag: latest
  imagePullPolicy: Always
  namespace: kinara-os
  jwtPublicKeyPath: /etc/jwt/public.pem
  imagePullSecrets:
    - name: ghcr-pull-secret

hpa:
  enabled: true

redis:
  enabled: true
  image: redis:7-alpine
  maxmemory: 512mb
  replicas: 1

# Services map: key = short name used in K8s resource names
# image: override ghcr.io image name (default: <key>-service)
# db:    target PostgreSQL database in the managed DO cluster
services:
  analytics:           { port: 8108, replicas: 2, maxReplicas: 20, db: kinara_analytics }
  appointment:         { port: 8109, replicas: 2, maxReplicas: 10, db: kinara_appointment }
  audit:               { port: 8115, replicas: 2, maxReplicas: 8,  db: kinara_audit }
  auth:                { port: 8080, replicas: 2, maxReplicas: 10, db: kinara_auth }
  cargo-maritime:      { port: 8101, replicas: 2, maxReplicas: 20, db: kinara_cargo }
  cargo:               { port: 8091, replicas: 2, maxReplicas: 15, db: kinara_cargo }
  clinical:            { port: 8082, replicas: 2, maxReplicas: 10, db: kinara_clinical }
  compliance:          { port: 8096, replicas: 2, maxReplicas: 10, db: kinara_compliance }
  cooperative:         { port: 8087, replicas: 2, maxReplicas: 10, db: kinara_cooperative }
  crew:                { port: 8110, replicas: 2, maxReplicas: 10, db: kinara_crew }
  customs:             { port: 8102, replicas: 2, maxReplicas: 10, db: kinara_customs }
  dock:                { port: 8100, replicas: 2, maxReplicas: 15, db: kinara_dock }
  documentation:       { port: 8106, replicas: 2, maxReplicas: 10, db: kinara_documentation }
  driver:              { port: 8090, replicas: 2, maxReplicas: 15, db: kinara_transport }
  extension:           { port: 8126, replicas: 2, maxReplicas: 8,  db: kinara_extension }
  farmer-finance:      { port: 8112, replicas: 2, maxReplicas: 10, db: kinara_farmer_finance }
  farmer:              { port: 8084, replicas: 2, maxReplicas: 15, db: kinara_farmer }
  fleet:               { port: 8089, replicas: 2, maxReplicas: 15, db: kinara_fleet }
  governance:          { port: 8083, replicas: 2, maxReplicas: 8,  db: kinara_governance }
  health-analytics:    { port: 8110, replicas: 2, maxReplicas: 10, db: kinara_analytics }
  health-compliance:   { port: 8111, replicas: 2, maxReplicas: 8,  db: kinara_compliance }
  immunization:        { port: 8121, replicas: 2, maxReplicas: 8,  db: kinara_immunization }
