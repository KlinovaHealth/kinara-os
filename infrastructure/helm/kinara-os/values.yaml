global:
  imageRegistry: registry.digitalocean.com/kinara
  imagePullPolicy: Always
  namespace: kinara-os
  jwtPublicKeyPath: /etc/jwt/public.pem

traefik:
  enabled: true
  image: traefik:v3.1
  replicas: 2

postgres:
  enabled: true
  image: postgres:16-alpine
  storageSize: 100Gi
  storageClass: do-block-storage

redis:
  enabled: true
  image: redis:7-alpine
  maxmemory: 512mb

services:
  auth:           { port: 8080, replicas: 2, maxReplicas: 10, db: kinara_auth }
  patient:        { port: 8081, replicas: 2, maxReplicas: 10, db: kinara_patient }
  clinical:       { port: 8082, replicas: 2, maxReplicas: 10, db: kinara_clinical }
  governance:     { port: 8083, replicas: 2, maxReplicas: 8,  db: kinara_governance }
  farmer:         { port: 8084, replicas: 2, maxReplicas: 15, db: kinara_farmer }
  notification:   { port: 8085, replicas: 2, maxReplicas: 10, db: kinara_notification }
  market:         { port: 8086, replicas: 3, maxReplicas: 20, db: kinara_market }
  cooperative:    { port: 8087, replicas: 2, maxReplicas: 10, db: kinara_cooperative }
  weather:        { port: 8088, replicas: 2, maxReplicas: 8,  db: kinara_weather }
  fleet:          { port: 8089, replicas: 2, maxReplicas: 15, db: kinara_fleet }
  driver:         { port: 8090, replicas: 2, maxReplicas: 15, db: kinara_driver }
  cargo:          { port: 8091, replicas: 2, maxReplicas: 15, db: kinara_cargo }
  route:          { port: 8092, replicas: 2, maxReplicas: 10, db: kinara_route }
  transport:      { port: 8093, replicas: 2, maxReplicas: 20, db: kinara_transport }
  last-mile:      { port: 8094, replicas: 2, maxReplicas: 20, db: kinara_lastmile }
  shipment:       { port: 8095, replicas: 2, maxReplicas: 20, db: kinara_shipment }
  compliance:     { port: 8096, replicas: 2, maxReplicas: 10, db: kinara_compliance }
  logistics-analytics: { port: 8097, replicas: 2, maxReplicas: 10, db: kinara_logistics_analytics }
