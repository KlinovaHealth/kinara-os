global:
  imageRegistry: ghcr.io/klinovahealth
  imageTag: latest
  imagePullPolicy: Always
  namespace: kinara-os
  jwtPublicKeyPath: /etc/jwt/public.pem
  imagePullSecrets:
    - name: ghcr-pull-secret

hpa:
  enabled: true

redis:
  enabled: true
  image: redis:7-alpine
  maxmemory: 512mb
  replicas: 1

# Services map: key = short name used in K8s resource names
# image: override ghcr.io image name (default: <key>-service)
# db:    target PostgreSQL database in the managed DO cluster
