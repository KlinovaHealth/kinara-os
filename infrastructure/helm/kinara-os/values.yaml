  referral:       { port: 8118, replicas: 2, maxReplicas: 10, db: kinara_referral }
  voyage:         { port: 8119, replicas: 2, maxReplicas: 10, db: kinara_voyage }
  sms-gateway:          { port: 8101, replicas: 2, maxReplicas: 10, db: kinara_sms }
  appointment:          { port: 8120, replicas: 2, maxReplicas: 10, db: kinara_appointment }
  immunization:         { port: 8121, replicas: 2, maxReplicas: 8,  db: kinara_immunization }
  lab:                  { port: 8122, replicas: 2, maxReplicas: 10, db: kinara_lab }
