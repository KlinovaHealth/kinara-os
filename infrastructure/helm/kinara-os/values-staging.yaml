# Staging environment overrides
# Registry: ghcr.io/klinovahealth (images built by CI — NOT DO Container Registry)
# Database: DigitalOcean Managed PostgreSQL cluster (kinara-prod, fra1)
# Cluster:  staging-kinara (DO Kubernetes, fra1)

global:
  imageRegistry: ghcr.io/klinovahealth
  imageTag: latest
  imagePullPolicy: Always
  namespace: staging
  jwtPublicKeyPath: /etc/jwt/public.pem
  imagePullSecrets:
    - name: ghcr-pull-secret

hpa:
  enabled: false

# Single replica per service in staging
defaultReplicas: 1

# Staging resource limits — 3-node s-2vcpu-4gb cluster (6 vCPU / 12 GB total)
defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

redis:
  enabled: true
  image: redis:7-alpine
  maxmemory: 256mb
  replicas: 1

# DigitalOcean Managed PostgreSQL — staging uses the kinara-prod cluster
# with kinara_app role (DML) created in Phase 2
database:
  host: kinara-prod-do-user-43233394-0.l.db.ondigitalocean.com
  port: "25060"
  user: kinara_app
  sslMode: require
  # password stored in Kubernetes secret: kinara-db-credentials / pass

ingress:
  enabled: true
  className: nginx
  # host set at deploy time via --set ingress.host=<loadbalancer-ip>.nip.io
  host: ""
  tls: false

# Override replicas to 1 for all services in staging
services:
  analytics:           { port: 8108, replicas: 1, maxReplicas: 2, db: kinara_analytics }
  appointment:         { port: 8109, replicas: 1, maxReplicas: 2, db: kinara_appointment }
