# Kinara OS — Flyway production configuration
# Target: DigitalOcean Managed PostgreSQL (Frankfurt, PG15)
#
# IMPORTANT: Kinara migrations use \c <db> switches and must be executed
# with psql, not the Flyway JDBC driver. This file configures the Flyway
# CLI for schema-history tracking only. Use run-migrations.sh for the
# actual migration run.
#
# Usage:
#   export FLYWAY_PASSWORD="<do-db-password>"
#   flyway -configFiles=infrastructure/flyway/flyway-prod.conf info
#   # then: ./infrastructure/scripts/run-migrations.sh

# ── Connection ──────────────────────────────────────────────────────────────
# DigitalOcean Managed PG connection string (replace <host> with actual endpoint)
flyway.url=jdbc:postgresql://${POSTGRES_HOST}:25060/kinara_auth?sslmode=require&ssl=true
flyway.user=${POSTGRES_USER}
flyway.password=${POSTGRES_PASSWORD}

# ── Migration sources ────────────────────────────────────────────────────────
flyway.locations=filesystem:infrastructure/database/migrations,filesystem:infrastructure/flyway/seeds

# ── Behaviour ────────────────────────────────────────────────────────────────
# Create the flyway_schema_history table on first run (empty prod DB)
flyway.baselineOnMigrate=false
flyway.baselineVersion=0

# Validate checksums before applying — catches accidental edits to applied migrations
flyway.validateOnMigrate=true

# Disallow out-of-order migration application
flyway.outOfOrder=false

# Mixed transactions (DDL + DML in same migration) — required for CREATE TABLE + INSERT
flyway.mixed=true

# Connect timeout (DigitalOcean Managed PG adds ~200ms cold latency)
flyway.connectRetries=5

# ── Naming ───────────────────────────────────────────────────────────────────
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__

# ── Placeholders (injected at runtime) ───────────────────────────────────────
flyway.placeholders.env=production
flyway.placeholders.tenant=TG
flyway.placeholders.region=Maritime

# ── Output ───────────────────────────────────────────────────────────────────
flyway.outputType=json
flyway.loggers=slf4j
