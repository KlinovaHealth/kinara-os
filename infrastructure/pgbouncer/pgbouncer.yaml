apiVersion: apps/v1
kind: Deployment
metadata:
  name: kinara-pgbouncer
  namespace: kinara-production
  labels:
    app: kinara-pgbouncer
    component: connection-pooler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kinara-pgbouncer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kinara-pgbouncer
        component: connection-pooler
    spec:
      securityContext:
        fsGroup: 70
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: config-init
          image: alpine:3.19
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cat > /pgbouncer-conf/pgbouncer.ini <<EOF
              [databases]
              * = host=${DB_HOST} port=${DB_PORT}

              [pgbouncer]
              listen_addr = 0.0.0.0
              listen_port = 5432
              auth_type = md5
              auth_file = /etc/pgbouncer/userlist.txt
              pool_mode = transaction
              max_client_conn = 500
              default_pool_size = 3
              min_pool_size = 0
              reserve_pool_size = 2
              reserve_pool_timeout = 5
              max_db_connections = 90
              server_idle_timeout = 30
              server_login_retry = 0.5
              server_tls_sslmode = require
              client_tls_sslmode = require
              client_tls_cert_file = /etc/pgbouncer/tls.crt
              client_tls_key_file = /etc/pgbouncer/tls.key
              unix_socket_dir =
              pidfile =
              ignore_startup_parameters = extra_float_digits
              max_prepared_statements = 0
              log_connections = 0
              log_disconnections = 0
              log_pooler_errors = 1
              stats_period = 60
              EOF
              # URL-decode DB_PASS before writing: pgx decodes %XX in DATABASE_URL,
              # but PgBouncer reads userlist.txt literally. Mismatch = auth failure.
              DECODED_PASS=$(printf '%s' "${DB_PASS}" | sed 's/%25/%/g; s/%21/!/g; s/%22/"/g; s/%23/#/g; s/%24/$/g; s/%26/\&/g; s/%27/'"'"'/g; s/%28/(/g; s/%29/)/g; s/%2A/*/g; s/%2B/+/g; s/%2C/,/g; s/%3A/:/g; s/%3B/;/g; s/%3D/=/g; s/%3F/?/g; s/%40/@/g; s/%5B/[/g; s/%5D/]/g; s/%7B/{/g; s/%7D/}/g')
              printf '"%s" "%s"\n' "${DB_USER}" "${DECODED_PASS}" > /pgbouncer-conf/userlist.txt
              chmod 644 /pgbouncer-conf/pgbouncer.ini
              chmod 640 /pgbouncer-conf/userlist.txt
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kinara-pgbouncer-backend
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: kinara-pgbouncer-backend
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kinara-pgbouncer-backend
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: kinara-pgbouncer-backend
                  key: pass
          volumeMounts:
            - name: pgbouncer-conf
              mountPath: /pgbouncer-conf
      containers:
        - name: pgbouncer
          image: ghcr.io/klinovahealth/kinara-pgbouncer:latest
          ports:
            - containerPort: 5432
              name: pgbouncer
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgbouncer-conf
              mountPath: /etc/pgbouncer
            - name: tls-certs
              mountPath: /etc/pgbouncer/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: tls-certs
              mountPath: /etc/pgbouncer/tls.key
              subPath: tls.key
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: pgbouncer-conf
          emptyDir: {}
        - name: tls-certs
          secret:
            secretName: kinara-tls-production
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kinara-pgbouncer
  namespace: kinara-production
  labels:
    app: kinara-pgbouncer
    component: connection-pooler
spec:
  type: ClusterIP
  selector:
    app: kinara-pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
      name: pgbouncer
