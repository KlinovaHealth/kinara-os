http:
  middlewares:
    jwt-auth:
      forwardAuth:
        address: "http://auth-service:8080/api/v1/validate"
        authResponseHeaders:
          - "X-User-ID"
          - "X-User-Role"
          - "X-Tenant-ID"
          - "X-Entity-Type"
          - "X-Scope-Would-Block"
          - "X-Scope-Reason"
          - "X-User-Scopes"
        trustForwardHeader: true

    rate-limit-default:
      rateLimit:
        average: 200
        burst: 50
        period: 1m
        sourceCriterion:
          requestHeaderName: "X-Tenant-ID"

    rate-limit-payment:
      rateLimit:
        average: 100
        burst: 20
        period: 1m
        sourceCriterion:
          requestHeaderName: "X-Tenant-ID"

    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Tenant-ID
        accessControlAllowOriginList:
          - "https://admin.kinaraos.com"
          - "https://app.kinaraos.com"
        accessControlMaxAge: 100
        addVaryHeader: true

    compress:
      compress: {}

    secure-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    audit-log:
      plugin:
        # Logs requests to audit-service via middleware
        # In production: use a custom Traefik plugin or sidecar
        headers:
          customRequestHeaders:
            X-Kinara-Trace: ""

  routers:
    # === AUTH ===
    auth:
      rule: "Host(`api.kinaraos.com`) && PathPrefix(`/api/v1/auth`)"
      service: auth-service
      entryPoints: [websecure]
      middlewares: [cors, compress, secure-headers]

    # === HEALTH (no auth — gateway health check) ===
    health:
      rule: "Host(`api.kinaraos.com`) && Path(`/health`)"
      service: gateway-health
      entryPoints: [websecure]

    # === PILLAR: HEALTH ===
    patient:
      rule: "Host(`api.kinaraos.com`) && PathPrefix(`/api/v1/patients`)"
