version: "3.9"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - kinara-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-env: &service-env
  JWT_PUBLIC_KEY_PATH: /etc/jwt/public.pem
  REDIS_URL: redis://redis:6379
  AES_KEY: ${AES_KEY}
  TLS_CERT_FILE: ""
  TLS_KEY_FILE: ""

networks:
  kinara-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-certs:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

services:
  # ── GATEWAY ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    <<: *service-defaults
    ports:
      - "80:80"
      - "443:443"
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik-certs:/certs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.kinaraos.com`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ── INFRASTRUCTURE ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *service-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kinara
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../flyway/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinara"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  flyway:
    image: flyway/flyway:10
    <<: *service-defaults
    command: -url=jdbc:postgresql://postgres:5432/kinara -user=${POSTGRES_USER:-kinara} -password=${POSTGRES_PASSWORD} -connectRetries=10 migrate
    volumes:
      - ../flyway/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── HEALTH PILLAR ─────────────────────────────────────────────────────
  auth-service:
    build: ../../services/auth-service
    <<: *service-defaults
    environment:
      <<: *service-env
      DATABASE_URL: postgres://kinara:${POSTGRES_PASSWORD}@postgres:5432/kinara_auth?sslmode=disable
      JWT_PRIVATE_KEY_PATH: /etc/jwt/private.pem
      PORT: "8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  patient-service:
    build:
      context: ../..
      dockerfile: services/patient-service/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      DATABASE_URL: postgres://kinara:${POSTGRES_PASSWORD}@postgres:5432/kinara_patient?sslmode=disable
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on: [postgres, redis, auth-service]

  clinical-service:
