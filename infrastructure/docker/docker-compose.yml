      DATABASE_URL: postgres://kinara:${POSTGRES_PASSWORD}@postgres:5432/kinara_analytics?sslmode=disable
      PORT: "8108"
    depends_on: [postgres, redis, auth-service]

  # ── SMS GATEWAY ───────────────────────────────────────────────────────
  sms-gateway:
    build:
      context: ../..
      dockerfile: services/sms-gateway/Dockerfile
    <<: *service-defaults
    environment:
      <<: *service-env
      DATABASE_URL: postgres://kinara:${POSTGRES_PASSWORD}@postgres:5432/kinara_sms?sslmode=disable
      PORT: "8200"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      MARKET_SERVICE_URL: http://market-service:8086
      WEATHER_SERVICE_URL: http://weather-service:8088
      ANALYTICS_SERVICE_URL: http://analytics-service:8108
      FARMER_SERVICE_URL: http://farmer-service:8084
    ports:
      - "8200:8200"
    depends_on: [postgres, redis, market-service, weather-service]

  # ── ADMIN DASHBOARD ───────────────────────────────────────────────────
  admin-dashboard-backend:
    build: ../../dashboard/admin/backend
    <<: *service-defaults
    environment:
      PORT: "8117"
      JWT_SECRET: ${JWT_SECRET:-kinara-admin-secret}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "8117:8117"
    depends_on: [postgres, redis]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.rule=Host(`admin.kinaraos.com`) && PathPrefix(`/api`,`/graphql`,`/ws`)"
      - "traefik.http.services.admin-api.loadbalancer.server.port=8117"

  admin-dashboard-frontend:
    image: nginx:alpine
    <<: *service-defaults
    volumes:
      - ../../dashboard/admin/frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-ui.rule=Host(`admin.kinaraos.com`)"
      - "traefik.http.services.admin-ui.loadbalancer.server.port=80"

  # ── GOVERNMENT HEALTH DASHBOARD ─────────────────────────────────────
  government-dashboard-backend:
    build: ../../dashboard/backend
    <<: *service-defaults
    environment:
      PORT: "8116"
      NODE_ENV: ${NODE_ENV:-production}
      HEALTH_ANALYTICS_URL: http://health-analytics-service:8109
      COMPLIANCE_URL: http://health-compliance-service:8110
      PATIENT_URL: http://patient-service:8081
      JWT_SECRET: ${JWT_SECRET:-kinara-admin-secret}
    ports:
      - "8116:8116"
    depends_on: [postgres]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gov-api.rule=Host(`health.kinaraos.tg`) && PathPrefix(`/api`,`/graphql`)"
      - "traefik.http.services.gov-api.loadbalancer.server.port=8116"

  government-dashboard-frontend:
    image: nginx:alpine
    <<: *service-defaults
    volumes:
      - ../../dashboard/frontend:/usr/share/nginx/html:ro
    ports:
      - "3001:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gov-ui.rule=Host(`health.kinaraos.tg`)"
      - "traefik.http.services.gov-ui.loadbalancer.server.port=80"

  # ── MONITORING ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    <<: *service-defaults
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    <<: *service-defaults
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-kinara2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.kinaraos.com
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *service-defaults
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    <<: *service-defaults
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    <<: *service-defaults
    volumes:
      - ../monitoring/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    <<: *service-defaults
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on: [elasticsearch]
